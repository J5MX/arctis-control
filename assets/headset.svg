<?xml version="1.0" encoding="UTF-8"?>
<!-- Ilustración propia de unos auriculares estilo Arctis para el panel. -->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 52 240 160">
  <defs>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2c33"/>
      <stop offset="1" stop-color="#111114"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a54"/>
      <stop offset="1" stop-color="#26262c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5200" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff5200" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="120" cy="196" rx="96" ry="10" fill="url(#glow)"/>

  <!-- Diadema exterior de acero -->
  <path d="M38 128 C34 46 206 46 202 128" fill="none" stroke="url(#band)" stroke-width="9" stroke-linecap="round"/>
  <!-- Banda elástica interior (ski goggle) -->
  <path d="M52 124 C56 76 184 76 188 124" fill="none" stroke="#ff5200" stroke-width="13" stroke-linecap="round"/>
  <path d="M52 124 C56 76 184 76 188 124" fill="none" stroke="#0a0a0c" stroke-opacity=".35" stroke-width="2" stroke-dasharray="2 6"/>

  <!-- Horquillas -->
  <path d="M38 126 L38 138" stroke="#4a4a54" stroke-width="7" stroke-linecap="round"/>
  <path d="M202 126 L202 138" stroke="#4a4a54" stroke-width="7" stroke-linecap="round"/>

  <!-- Micrófono retráctil -->
  <path d="M22 168 C8 172 6 186 18 192" fill="none" stroke="#3a3a42" stroke-width="5" stroke-linecap="round"/>
  <circle cx="20" cy="192" r="4" fill="#ff5200"/>

  <!-- Copa izquierda -->
  <rect x="14" y="132" width="50" height="66" rx="22" fill="url(#cup)" stroke="#3a3a42" stroke-width="2"/>
  <rect x="58" y="138" width="10" height="54" rx="5" fill="#1b1b20"/>
  <ellipse cx="39" cy="165" rx="12" ry="18" fill="none" stroke="#ff5200" stroke-width="2.5" opacity=".9"/>

  <!-- Copa derecha -->
  <rect x="176" y="132" width="50" height="66" rx="22" fill="url(#cup)" stroke="#3a3a42" stroke-width="2"/>
  <rect x="172" y="138" width="10" height="54" rx="5" fill="#1b1b20"/>
  <ellipse cx="201" cy="165" rx="12" ry="18" fill="none" stroke="#ff5200" stroke-width="2.5" opacity=".9"/>
  <!-- Rueda de volumen -->
  <rect x="222" y="150" width="6" height="22" rx="3" fill="#5a5a66"/>
</svg>
